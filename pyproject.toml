[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-artist"
version = "0.1.0"
description = "Агент-художник: художники уточняют детали у эксперта и рисуют, пока он не будет доволен"
requires-python = ">=3.12"
dependencies = [
    "accelerate",
    "diffusers",
    "httpx",
    "huggingface_hub",
    "ollama",
    "openai",
    "pillow",
    "python-dotenv",
    "safetensors",
    "torch",
    "transformers",
]

[project.optional-dependencies]
# Для ноутбука с анализом: pip install -e ".[analysis]"
analysis = ["ipykernel", "matplotlib", "nbconvert", "nbformat", "pandas"]
# Для тестов: pip install -e ".[dev]" && pytest
dev = ["pytest"]

[project.scripts]
agent-artist = "agent_artist.cli:main"
agent-artist-experiment = "agent_artist.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
